<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JUFOSearch · Journal finder</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <a class="brand" href="/"><span class="mark" aria-hidden="true">J</span> JUFOSearch</a>
      <a class="policy" href="https://www.aalto.fi/en/services/open-access-agreements" target="_blank" rel="noopener">Aalto publishing agreements ↗</a>
    </div>
  </header>
  <main class="wrap">
    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title">Find a journal</h1>
      <form id="search">
        <div class="search-row">
          <label for="query" class="sr-only">Journal title, ISSN, initials or research topic</label>
          <input id="query" type="search" name="q" placeholder="Journal title, ISSN, initials or research topic" minlength="2" maxlength="160" required>
          <button class="primary" type="submit">Search</button>
        </div>
      </form>
      <div class="examples">
        <button type="button" data-query="physics">Physics</button>
        <button type="button" data-query="ml">Machine learning</button>
        <button type="button" data-query="cfd">CFD</button>
      </div>
    </section>
    <section class="results" aria-label="Search results">
      <p id="status" role="status" aria-live="polite"></p>
      <p id="notices" role="status" hidden></p>
      <fieldset id="filters" class="filters" hidden>
        <legend class="sr-only">Filter results</legend>
        <details class="facet" data-field="level"><summary>JUFO level <span></span></summary><fieldset><legend class="sr-only">JUFO level</legend><div class="choices"></div></fieldset></details>
        <details class="facet" data-field="publisher"><summary>Publisher <span></span></summary><fieldset><legend class="sr-only">Publisher</legend><div class="choices"></div></fieldset></details>
        <details class="facet" data-field="fee"><summary>APC support <span></span></summary><fieldset><legend class="sr-only">APC support</legend><div class="choices"></div></fieldset></details>
        <details class="facet" data-field="licence"><summary>Licence <span></span></summary><fieldset><legend class="sr-only">Licence</legend><div class="choices"></div></fieldset></details>
        <details class="facet" data-field="model"><summary>Publishing model <span></span></summary><fieldset><legend class="sr-only">Publishing model</legend><div class="choices"></div></fieldset></details>
        <button id="reset-filters" class="secondary" type="button">Clear filters</button>
      </fieldset>
      <p id="filter-status" role="status" hidden></p>
      <div id="pagination" class="pagination" hidden>
        <label class="page-size" for="page-size">Per page
          <select id="page-size"><option value="50">50</option><option value="100">100</option><option value="150">150</option></select>
        </label>
        <nav class="page-navigation" aria-label="Results pages">
          <button type="button" class="secondary" data-page="previous">Previous</button>
          <span data-page-label tabindex="-1"></span>
          <button type="button" class="secondary" data-page="next">Next</button>
        </nav>
      </div>
      <div id="cards"></div>
      <nav id="bottom-pagination" class="page-navigation bottom-pagination" aria-label="Results pages at end of list" hidden>
        <button type="button" class="secondary" data-page="previous">Previous</button>
        <span data-page-label></span>
        <button type="button" class="secondary" data-page="next">Next</button>
      </nav>
    </section>
    <footer>
      <a href="https://jfp.csc.fi/jufoportal" target="_blank" rel="noopener">JUFO Portal ↗</a>
      <a href="https://search.scifree.se/aalto" target="_blank" rel="noopener">Aalto SciFree ↗</a>
      <a href="https://www.crossref.org/documentation/retrieve-metadata/rest-api/" target="_blank" rel="noopener">Crossref ↗</a>
      <a href="https://finelib.fi/open-access-publishing-in-elsevier-journals/" target="_blank" rel="noopener">FinELib ↗</a>
    </footer>
  </main>
  <dialog id="agreement-dialog" aria-labelledby="agreement-title">
    <header class="dialog-header">
      <h2 id="agreement-title"></h2>
      <form method="dialog"><button class="secondary" type="submit" autofocus>Close</button></form>
    </header>
    <div id="agreement-body"></div>
  </dialog>
</body>
</html>
